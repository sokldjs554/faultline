# gcloud builds submit --config deploy/gcp/cloudbuild.yaml --substitutions=_REGION=asia-northeast3
steps:
  - name: gcr.io/cloud-builders/docker
    args: ["build", "-t", "${_REGION}-docker.pkg.dev/$PROJECT_ID/faultline/api:$SHORT_SHA", "."]
  - name: gcr.io/cloud-builders/docker
    args: ["push", "${_REGION}-docker.pkg.dev/$PROJECT_ID/faultline/api:$SHORT_SHA"]
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args: ["run", "deploy", "faultline", "--image", "${_REGION}-docker.pkg.dev/$PROJECT_ID/faultline/api:$SHORT_SHA", "--region", "${_REGION}", "--allow-unauthenticated", "--memory", "2Gi", "--cpu", "2", "--max-instances", "3"]
substitutions:
  _REGION: asia-northeast3
images:
  - "${_REGION}-docker.pkg.dev/$PROJECT_ID/faultline/api:$SHORT_SHA"
