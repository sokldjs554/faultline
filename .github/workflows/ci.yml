name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.4"
          pip install -e ".[dev,crosscheck]"
      - name: Lint
        run: ruff check src tests scripts && ruff format --check src tests scripts
      - name: Tests (시뮬레이터 불변식 · 추정기 · econml 교차 검증 · API · JS 포트 일치)
        run: pytest -q
      - name: Docs numbers match artifacts
        run: python scripts/fill_numbers.py --check
  image:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: faultline:ci
