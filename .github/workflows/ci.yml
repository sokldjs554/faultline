name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.4"
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests scripts && ruff format --check src tests scripts
      - name: Tests (시뮬레이터 불변식, 정의 엔진, 품질 점검, 특징 누수, 감시, API, 정적 데모)
        run: pytest -q
      - name: Docs numbers match artifacts
        run: python scripts/fill_numbers.py --check
      - name: Committed static demo is up to date
        run: |
          python scripts/build_static_demo.py --out /tmp/demo
          diff -r /tmp/demo docs/demo
  console:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Console smoke (모든 탭, 다크, 모바일)
        run: |
          python scripts/build_static_demo.py --out /tmp/demo
          (cd /tmp/demo && python -m http.server 8020 >/dev/null 2>&1 &)
          sleep 2
          node scripts/smoke_console.cjs http://localhost:8020 / /tmp/shots
  image:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: faultline:ci
      - name: Build Lambda image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.lambda
          push: false
          tags: faultline-lambda:ci
